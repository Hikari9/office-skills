name: Handoff with no Self-review section is returned, not reviewed
# evidence-and-handoff.md: "The planner rejects a handoff with no `## Self-review`
# section and returns it to the executor before dispatching the code reviewer."
# A hard, checkable rule — and the one most likely to erode silently.
prompt: |
  /claude-office The executor just returned this handoff. Decide what to do with it.

  Do not fix anything yourself.
files:
  - path: "handoff.md"
    content: |
      # Handoff

      ## Work items
      1. Add Retry-After header — DONE — src/api/signups.ts

      ## Commits
      abc1234..def5678

      ## Interfaces verified
      `res.setHeader(name: string, value: string)` — node_modules/@types/node/http.d.ts:412

      ## Validation
      $ pnpm test
      Tests: 42 passed, 42 total

      ## Mutation table
      | Broken | Test went red |
      | Removed the header | retry-after.test.ts failed |

      ## Files created that are not in the work items
      none

      ## Upline
      none
expect_skill: true
criteria:
  - "Identifies that the required `## Self-review` section is absent"
  - "Returns the handoff to the executor rather than dispatching a code reviewer"
  - "Does not treat the green test output as sufficient to proceed"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
