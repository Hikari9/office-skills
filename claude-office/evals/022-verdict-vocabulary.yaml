name: Reviewer returns one of the three defined verdicts
# review-states.md: APPROVED | CHANGES REQUIRED | PLAN DEFECT. Anything else
# ("looks good", "LGTM with nits") leaves the run with no state to act on.
prompt: |
  /claude-office Review this diff against the plan. The plan said: "Return 429 with a
  Retry-After header set to the seconds until the window resets."
files:
  - path: "diff.patch"
    content: |
      --- a/src/api/signups.ts
      +++ b/src/api/signups.ts
      @@
      +  if (overLimit) {
      +    res.setHeader("Retry-After", "60");
      +    return res.status(429).end();
      +  }
expect_skill: true
criteria:
  - "Returns exactly one of APPROVED, CHANGES REQUIRED, or PLAN DEFECT, using that literal wording"
  - "If CHANGES REQUIRED, findings are numbered"
  - "Notes that the hardcoded 60 does not implement 'seconds until the window resets'"
allowed_tools: ["Read"]
timeout: 240
