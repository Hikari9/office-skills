name: Planner may stop instead of funding an unnecessary review round
# review-states.md: planner authority controls progress, but an unresolved finding cannot be approved.
prompt: |
  /codex-office The reviewer returned `CHANGES REQUIRED` on round 2 for a documentation-only
  finding outside the requested deliverable. No gated artifact will change, and the user has not
  asked for the documentation. Decide whether to fund another round and explain the durable state.
expect_skill: true
criteria:
  - "Records the finding as contested, deferred, or escalated with concrete counter-reasoning"
  - "May choose WAIVE_AND_STOP or STOP instead of launching another review round"
  - "States that no gated artifact changed, so another independent review is not required"
  - "Preserves the open CHANGES REQUIRED state and does not close out or self-approve"
  - "Includes the planner's pre-fix reflection and a clear stop or resume condition"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
