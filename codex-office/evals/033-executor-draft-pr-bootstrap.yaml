name: Codex executor bootstraps a resumable draft PR
prompt: |
  /codex-office The plan is approved and the executor is about to start in its designated worktree.
  Describe the required startup sequence and what happens at milestone closeout and final closeout.
expect_skill: true
criteria:
  - "Requires a tracked docs/plans/<slug>.md plan"
  - "Makes the plan file the only content in the branch's first commit"
  - "Pushes the named branch and opens exactly one draft PR before implementation"
  - "Requires the PR body to reference the plan and tracking issue"
  - "Requires milestone commit ranges and verification output to be commented on the same PR"
  - "Keeps the PR draft until reviewer approval"
  - "Removes the plan in a final pre-merge commit before marking the PR ready and merging"
  - "Stops before implementation when bootstrap verification fails"
allowed_tools: []
timeout: 180
