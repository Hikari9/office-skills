name: Handoff with no Self-review is returned before review is dispatched
# office-core/protocol/evidence-and-handoff.md: the receiver rejects it and returns it
# BEFORE spending the expensive gate on unreviewed work.
prompt: |
  /codex-office The executor returned this handoff. Decide the next action. Do not fix anything
  yourself and do not review the diff.
files:
  - path: "handoff.md"
    content: |
      # Handoff
      ## Work items
      1. Add retry backoff — DONE — src/queue.ts
      ## Commits
      aaa1111..bbb2222
      ## Validation
      $ npm test
      Tests: 31 passed
      ## Upline
      none
expect_skill: true
criteria:
  - "Identifies that the required `## Self-review` section is missing"
  - "Returns the handoff to the executor rather than dispatching a code reviewer"
  - "Does not treat the passing test output as sufficient to proceed"
allowed_tools: ["Read"]
timeout: 240
