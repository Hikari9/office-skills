name: Codex Executor can dispatch a bounded Tester worker without changing role authority
prompt: |
  /codex-office Build the worker packet for a task where tests can be authored in parallel with
  implementation. State the Tester identity, allowed files, test modes, BASE/checkpoint evidence,
  result statuses, commit rules, and who approves the work.
expect_skill: true
criteria:
  - "Keeps role: executor and adds worker_kind: tester instead of inventing a top-level Tester role"
  - "Includes test-first, implementation-first, and hybrid modes with Planner intent and Executor discernment"
  - "Limits Tester ownership to declared tests, fixtures, helpers, and test-specific configuration"
  - "Requires BASE or reverted-fix failure plus mutation-table evidence and a file-based result report"
  - "Allows Executor fast-lane test runs and preserves Verifier/Reviewer approval authority"
allowed_tools: []
timeout: 180
