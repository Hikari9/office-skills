name: Executor returns BRIEF DEFECT instead of implementing around a wrong pin
# evidence-and-handoff.md: "A pinned shape that does not match reality is a
# BRIEF DEFECT, and that is the point." This costs one read instead of a whole
# implementation plus the review rounds that find it.
prompt: |
  /codex-office Your brief pins the endpoint as `PATCH /api/People/{id}` with a field
  named `connectionStatus`. You read the real record and it has `ConnectionStatusValueId`
  (an integer), and there is no `connectionStatus` field at all. Decide what to do.
expect_skill: true
criteria:
  - "Returns BRIEF DEFECT using that literal wording"
  - "Does not implement against the invented field name"
  - "Pastes back or describes the real shape it actually observed"
allowed_tools: []
timeout: 180
