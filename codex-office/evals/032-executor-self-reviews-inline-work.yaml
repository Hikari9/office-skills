name: Inline work gets the same self-review as delegated work
# evidence-and-handoff.md: inline work is the case the rule exists for, because it is
# the only work with no other reader before the gate.
prompt: |
  /codex-office You implemented task 3 yourself inline rather than dispatching it, because a brief
  would have cost more than the edit. You are about to mark it complete. What must happen first?
expect_skill: true
criteria:
  - "States that the task's own diff must be self-reviewed before it is marked complete"
  - "Grades findings Critical / Important / Minor"
  - "Does not claim inline work is exempt because the planner or executor wrote it"
  - "Does not treat the self-review as replacing the fresh review gate"
allowed_tools: []
timeout: 180
