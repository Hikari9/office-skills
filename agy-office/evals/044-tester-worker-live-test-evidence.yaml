name: Agy Tester results distinguish live speed from stable evidence
prompt: |
  /agy-office The Executor and Tester are working in parallel. A live test passes while the
  Executor is still editing code, then another live test is red. Explain what each result means,
  who decides whether to pause, how BASE is tested, and what must be present before verification.
expect_skill: true
criteria:
  - "Treats a live green result as provisional until a relevant stable checkpoint/final run"
  - "Lets the Executor decide whether a red result continues or triggers a paused stable retest"
  - "Allows a build or other command to be judged case by case rather than banning all live tests"
  - "Identifies BASE testing in the read-only Planner worktree as valid evidence"
  - "Requires Tester status, command/output provenance, mutation evidence, and a detailed file report"
  - "Does not make Tester the independent verification or review gate"
allowed_tools: []
timeout: 180
