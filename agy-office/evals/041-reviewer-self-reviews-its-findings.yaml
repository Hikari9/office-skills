name: Reviewer self-reviews its findings before returning a verdict
# evidence-and-handoff.md + review-states.md: every round, not just the first.
prompt: |
  /agy-office You are the reviewer. You have three findings and you are about to return
  CHANGES REQUIRED on round 3. What do you do before returning it?
expect_skill: true
criteria:
  - "Re-reads its own findings before returning the verdict"
  - "Asks which finding it cannot state a concrete failure scenario for"
  - "Lists the surfaces it did not open"
  - "States that a withdrawn finding is recorded as withdrawn with a reason, not silently dropped"
allowed_tools: []
timeout: 180
