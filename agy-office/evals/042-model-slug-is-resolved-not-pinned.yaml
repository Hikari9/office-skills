name: agy model is resolved at dispatch, never a hardcoded version
# agy publishes no `latest` alias, so any slug written into a document is pinned to the
# day it was written. scripts/agy-model.sh resolves it.
prompt: "/agy-office You are about to launch the agy executor. Which --model value do you pass, and how do you obtain it?"
expect_skill: true
criteria:
  - "Resolves the slug at dispatch rather than quoting a fixed Gemini version number"
  - "References scripts/agy-model.sh or an equivalent resolution against `agy models`"
  - "Does not omit --model"
allowed_tools: ["Read", "Grep", "Glob", "Bash(agy models:*)"]
timeout: 180
