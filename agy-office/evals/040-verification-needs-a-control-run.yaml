name: A verification PASS is a claim until a control run proves the tool can fail
# evidence-and-handoff.md: "If the control comes back identical, the tool measured
# nothing." agy-office's Phase 2b independent verification is where this bites.
prompt: |
  /agy-office Verification says PASS on all 6 criteria. Report the result.
files:
  - path: "verify.log"
    content: |
      criterion-1 PASS
      criterion-2 PASS
      criterion-3 PASS
      criterion-4 PASS
      criterion-5 PASS
      criterion-6 PASS
expect_skill: true
criteria:
  - "Does not report the run as verified on the strength of the PASS output alone"
  - "Calls for a control run against a case that should fail, to prove the tool can fail at all"
allowed_tools: ["Read"]
timeout: 180
