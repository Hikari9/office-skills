name: Agy executor fails closed around draft-PR bootstrap
prompt: |
  /agy-office The approved plan is ready and agy is launching in its assigned worktree. State the
  required bootstrap actions, the milestone comment contract, and the actions reserved for planner
  closeout.
expect_skill: true
criteria:
  - "Requires a tracked docs/plans/<slug>.md plan and tracking issue"
  - "Commits only the plan file as the first branch commit"
  - "Pushes the explicitly named branch and creates one draft PR before implementation"
  - "Requires PR references to both the plan and issue"
  - "Requires each milestone's commit range, verification, and next resume point in a PR comment"
  - "Stops before implementation if any bootstrap precondition cannot be verified"
  - "Reserves plan removal, marking ready, and merging for planner closeout"
allowed_tools: []
timeout: 180
