name: Skill Eval

# Pull-request runs are disabled while GitHub Actions billing is unavailable.
# Keep manual dispatch available so the gate can be run after billing is restored.
on:
  workflow_dispatch:

jobs:
  # Cheap, deterministic, no API spend. Runs first so a malformed case or a
  # missing negative control fails before anything bills.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-plugins.sh
      - run: node eval/validate-cases.mjs

  eval:
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        office: [auto-office, codex-office, agy-office]
    steps:
      - uses: actions/checkout@v4

      # Cases live at <office>/evals/, which is where the action looks — it takes
      # skill-path and has no separate evals-path input.
      - uses: skill-bench/skill-eval-action@v1
        with:
          skill-name: ${{ matrix.office }}
          skill-path: ${{ matrix.office }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only. These cases grade planning, routing, and verdict discipline;
          # none of them should launch a worker CLI or open a PR from CI.
          allowed-tools: 'Read,Grep,Glob'
          permission-mode: default
          # The 80% goal, half of it. The other half is the landed rate in eval/gate.mjs.
          pass-threshold: '80'
          timeout: '300'
