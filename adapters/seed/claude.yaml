id: claude
verified_state: valid-unverified
version_fingerprint:
  command: [claude, --version]
  parser: first-line
model_source:
  type: catalog-plus-probe
  command: null
effort_mapping:
  none: null
  low: low
  medium: medium
  high: high
  xhigh: null
  max: null
benchmark_slug_mapping: {}
invocation:
  executable: claude
  argv: [--bg, --remote-control, "{label}", --model, "{model}", --effort, "{effort}", --add-dir, "{cwd}"]
  prompt_transport: stdin
  cwd_transport: add-dir
safe_prompt_passing:
  shell: false
  supports_prompt_file: true
  notes: Pipe/read prompt on stdin; positional prompt can register an idle agent without starting work on observed versions.
dispatch_forms: [cli, in-session]
trusted_for: [discovery, read-only-investigation, prototype, reversible-sandbox-worker, conformance]
quota_probe:
  type: external-primitive
  command: null
  unknown_is_unlimited: false
shallow_review:
  supported: true
  minimum_effort: low
agentic_capability:
  default: unknown
failure_signatures:
  - {id: positional-prompt-idle, attribution: adapter, pattern: "idle - send a prompt to start"}
  - {id: resume-bg-fork, attribution: harness, pattern: "resume against live session creates a new writer"}
conformance:
  deterministic: pending
  live: pending
source_notes: Current office-skills Claude mechanics seeded for migration; tool allowlists remain dispatch-specific and must be generated from the packet/environment.
