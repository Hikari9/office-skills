id: codex
verified_state: valid-unverified
version_fingerprint:
  command: [codex, --version]
  parser: first-line
model_source:
  type: catalog-plus-probe
  command: null
effort_mapping:
  none: none
  low: low
  medium: medium
  high: high
  xhigh: xhigh
  max: max
benchmark_slug_mapping: {}
invocation:
  executable: codex
  argv: [exec, --yolo, -m, "{model}", -c, "model_reasoning_effort=\"{effort}\"", --cd, "{cwd}", "{prompt}"]
  prompt_transport: argv
  cwd_transport: flag
safe_prompt_passing:
  shell: false
  supports_prompt_file: true
  notes: Read prompt bytes and pass as one argv element; never build a shell command.
dispatch_forms: [cli]
trusted_for: [discovery, read-only-investigation, prototype, reversible-sandbox-worker, conformance]
quota_probe:
  type: external-primitive
  command: null
  unknown_is_unlimited: false
shallow_review:
  supported: true
  minimum_effort: high
agentic_capability:
  default: unknown
failure_signatures:
  - {id: stdin-deadlock, attribution: adapter, pattern: "background launch waiting on stdin"}
  - {id: resume-wrong-cwd, attribution: harness, pattern: "resume inherited caller cwd"}
conformance:
  deterministic: pending
  live: pending
source_notes: Current office-skills Codex mechanics seeded for migration; must be re-conformed locally before promotion.
