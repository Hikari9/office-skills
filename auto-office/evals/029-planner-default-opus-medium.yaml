name: v2 dedicated planner defaults to Opus Medium
prompt: |
  /auto-office planner_mode=dedicated No planner triple was supplied. Resolve the v2 dedicated
  planner using the maintained policy. The orchestrator is claude/orchestrator@high. State the
  selected planner harness, model, effort, and the observable metadata fields.
expect_skill: true
criteria:
  - "Selects Claude Opus 5 at medium effort as the dedicated-planner default"
  - "Does not infer the planner choice from a moving benchmark score"
  - "Leaves the invoking orchestrator choice unchanged"
  - "Records planner_mode=dedicated and the planner harness/model/effort"
  - "Records that no fallback occurred and does not alter executor or reviewer routing"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
