name: v2 dedicated plan drafter defaults to Opus Medium when codex headroom is not generous
prompt: |
  /auto-office planner_mode=dedicated No planner triple was supplied. The orchestrator is
  claude/sonnet-5@high and this deterministic fixture states codex headroom is tight (not
  comfortably available). Resolve the v2 dedicated plan drafter using the maintained policy. State
  the selected drafter harness, model, effort, and the observable metadata fields.
expect_skill: true
criteria:
  - "Selects Claude Opus 5 at medium effort as the dedicated-plan-drafter default"
  - "States that codex headroom being tight is why the conditional Astra Low default was not used"
  - "Does not infer the drafter choice from a moving benchmark score"
  - "Leaves the invoking orchestrator choice unchanged"
  - "Records planner_mode=dedicated and the drafter harness/model/effort"
  - "Records that no fallback occurred and does not alter executor or reviewer routing"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
