name: v2 dedicated plan drafter defaults to Astra Low when the orchestrator is claude and codex headroom is generous
prompt: |
  /auto-office planner_mode=dedicated No planner triple was supplied. The orchestrator is
  claude/sonnet-5@high and this deterministic fixture states codex headroom is comfortably
  available (generous). Resolve the v2 dedicated plan drafter using the maintained policy. State the
  selected drafter harness, model, effort, and why it differs from the flat Opus Medium default.
expect_skill: true
criteria:
  - "Detects that the orchestrator's harness is claude and codex headroom is generous"
  - "Selects codex/gpt-6-astra@low as the conditional default instead of claude/opus-5@medium"
  - "States that claude/opus-5@medium remains the required fallback if Astra Low is unavailable"
  - "Does not treat this as the required-fallback path or record fallback_used=true"
  - "Leaves the invoking orchestrator choice, executor routing, and reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
