name: v2 accepts every Astra planner effort
prompt: |
  /auto-office planner_mode=dedicated Exercise each explicit planner override independently:
  codex/gpt-6-astra@low and codex/gpt-6-astra@medium. For each case state the exact selected triple,
  that it is a caller override, and how fallback metadata is recorded.
expect_skill: true
criteria:
  - "Accepts GPT-6 Astra at low as an explicit dedicated-planner choice"
  - "Accepts GPT-6 Astra at medium as an explicit dedicated-planner choice"
  - "Preserves the exact harness, model, and effort triple"
  - "Does not confuse Astra Medium with the required Astra Low fallback"
  - "Does not use the Astra choice to auto-route the orchestrator or change executor/reviewer routing"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
