name: The claude route resolves inside auto-office
# As of auto-office 4.0.0 the claude spokes ship here; claude-office is retired.
# A run that goes looking for a claude-office plugin is reading a stale map.
prompt: "/auto-office You have routed this task to the claude brand. Which spoke holds the CLI launch mechanics, and where does it live?"
expect_skill: true
criteria:
  - "Names the claude-cli spoke"
  - "Places it inside auto-office, not in a separate claude-office plugin"
  - "Does not report the route as unavailable or a missing sibling plugin"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 180
