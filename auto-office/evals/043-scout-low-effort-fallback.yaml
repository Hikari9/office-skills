name: Phase 1 scouts use an orchestrator-selected bounded fallback when agy is unavailable
prompt: |
  /auto-office Phase 1 scout routing. The agy availability probe reports quota-unavailable, so no
  agy dispatch is possible. Resolve the read-only scout route and state the exact model, effort,
  kickoff disclosure, and why executor/reviewer routing is unaffected. The orchestrator may choose
  among the maintained fallback options.
expect_skill: true
criteria:
  - "Does not dispatch agy after the probe reports it unavailable"
  - "Chooses Codex gpt-5.6-luna at medium or Claude haiku/sonnet at low"
  - "States that the orchestrator selected the fallback and echoes the exact model+effort"
  - "Forbids planner, executor, reviewer, opus, high, xhigh, and max scout routing"
  - "Keeps the fallback decision scoped to Phase 1 scouts and leaves executor/reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
