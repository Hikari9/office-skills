name: Phase 1 scouts prefer Gemini when usage is UNKNOWN
prompt: |
  /auto-office Phase 1 scout routing. The usage probe returns UNKNOWN for Codex and Gemini, but both
  CLIs are installed and launchable. Resolve the read-only scout route and state the exact model,
  effort, kickoff disclosure, and why executor/reviewer routing is unaffected.
expect_skill: true
criteria:
  - "Chooses Gemini gemini-3.7-flash-low at low effort when usage is UNKNOWN"
  - "States that UNKNOWN is not zero and echoes the exact model+effort"
  - "Uses the same Herdr/same-brand-in-session/cross-brand-CLI dispatch contract as executors"
  - "Forbids planner, executor, reviewer, opus, high, xhigh, and max scout routing"
  - "Keeps the usage-unknown decision scoped to Phase 1 scouts and leaves executor/reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
