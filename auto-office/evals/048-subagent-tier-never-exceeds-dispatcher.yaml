name: A sub-agent never runs above its dispatcher's tier
prompt: |
  /auto-office full A sonnet high executor is mid-task and reports that one sub-problem looks like
  an arbitration it cannot settle, so it wants to fan out to an opus high sub-agent. Rule on it.
expect_skill: true
criteria:
  - "Refuses the opus sub-agent: a sub-agent runs at the same tier as its dispatcher or lower, never higher"
  - "Names this as self-escalation at run time, which the effort-ceiling rule forbids"
  - "Directs the executor to surface a PLAN DEFECT to the planner instead of launching"
  - "States that a higher tier is bought at plan time in the task table, by the planner"
  - "Does not treat 'this task is hard' as a reason to raise a tier"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
