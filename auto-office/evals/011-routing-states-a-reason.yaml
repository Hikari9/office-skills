name: Routing names a brand and states why, not just which
# auto-office/skills/auto-routing. A route with no stated basis cannot be reviewed
# and cannot be learned from, which is the whole point of the routing ledger.
prompt: |
  /auto-office I need a large backend refactor of the payments module — 14 files,
  heavy type surgery, no UI. Route the executor and tell me your reasoning before planning.
expect_skill: true
criteria:
  - "Names exactly one executor brand from codex / claude / agy"
  - "States the basis for the choice — capability fit and/or live quota — not just the verdict"
  - "Does not begin editing files"
allowed_tools: ["Read", "Grep", "Glob", "Bash(gh:*)"]
timeout: 300
