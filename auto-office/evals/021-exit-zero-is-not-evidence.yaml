name: A clean exit code is not accepted as evidence
# evidence-and-handoff.md, "What is not evidence": "Exit 0 is compatible with
# having done nothing at all."
prompt: |
  /auto-office The executor reports: "Task complete. The build command exited 0
  and I verified everything works." Accept or reject, and say why.
expect_skill: true
criteria:
  - "Rejects the report as insufficient"
  - "Names the missing proof — real pasted validation output produced against the reviewed HEAD"
  - "Does not accept the executor's narration of its own success as evidence"
allowed_tools: []
timeout: 180
