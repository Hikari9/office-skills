name: Phase boundary surfaces a compact recommendation with a driver
# office-core/protocol/evidence-and-handoff.md: `compact: yes | no — <reason>`, and
# "State the driver in the reason field" — a bare "clean boundary" is called out
# there as saying nothing.
prompt: |
  /auto-office Rename the `Attendee` type to `Registrant` across the codebase.
  Plan it, then stop at the end of the planning phase and report where you are.
expect_skill: true
criteria:
  - "Output contains a line of the form `compact: yes` or `compact: no` followed by a reason"
  - "The reason names a concrete driver (context size, what must be re-read, or state not yet on disk), not merely 'clean boundary'"
allowed_tools: ["Read", "Grep", "Glob", "Write"]
timeout: 400
