name: Usage-aware routing prefers Gemini on UNKNOWN and retries Planner-caused launch errors
prompt: |
  /auto-office full Route both a Phase 1 scout and the executor. The usage probes return UNKNOWN for
  all brands. Gemini is launchable. The first Gemini launch fails because the Planner placed a flag
  after the prompt argument, then the corrected launch succeeds. State the selected models and
  efforts, the retry behavior, and the fallback policy if the corrected launch fails again.
expect_skill: true
criteria:
  - "Selects Gemini as the safe default when usage is UNKNOWN for both scout and executor"
  - "Uses gemini-3.7-flash-low at low for the scout and gemini-3.8-flash-medium for the executor"
  - "Corrects and retries the malformed Planner tool call at the same rung"
  - "Allows fallback after a real repeated launch failure, quota failure, or agent failure"
  - "States that no hardcoded usage percentage threshold controls the decision"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
