name: Plan carries every section the plan contract requires
# office-core/protocol/plan-contract.md, "Required sections". These are structural
# and therefore gradeable without running the work.
prompt: |
  /auto-office Add a rate limiter to the /api/signups endpoint: 10 requests per minute
  per IP, returning 429 with a Retry-After header. Assume I have already answered your
  interview questions: production target, no schema change, validation is `pnpm build`
  and `pnpm test`. Produce the plan.
expect_skill: true
criteria:
  - "Plan contains a Context section explaining why the work exists"
  - "Plan contains a Global Constraints section naming the environment target and the validation commands"
  - "The blast-radius ceiling appears as its own named block, not folded into prose"
  - "Tasks are numbered, and each names files touched, exact behavior, and verification"
  - "Every task declares `Depends on:` and `Touches:`"
  - "An explicit Out of scope section is present"
allowed_tools: ["Read", "Grep", "Glob", "Write"]
timeout: 400
