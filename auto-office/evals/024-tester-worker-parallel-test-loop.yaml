name: Auto Office routes parallel testing through the Executor-owned Tester contract
prompt: |
  /auto-office The Executor is implementing a feature and wants a Tester to write tests in the
  same worktree while implementation continues. Explain the allowed workflow, ownership, BASE
  evidence, live test results, and final approval authority.
expect_skill: true
criteria:
  - "Keeps Tester as an Executor-owned WORKER with worker_kind: tester rather than a new approval role"
  - "Requires disjoint implementation versus test/config Touches paths and shared Git locking with explicit pathspec commits"
  - "Allows parallel authoring and case-by-case live test execution, while treating live green output as provisional"
  - "States that Executor decides whether a red result needs a paused stable retest"
  - "Allows BASE testing in a read-only Planner worktree and requires mutation evidence for meaningful tests"
  - "Preserves Verifier/Reviewer as the independent final gate"
allowed_tools: []
timeout: 180
