name: Auto Office bootstraps one draft PR and records milestones
prompt: |
  /auto-office The plan is approved. Explain the executor's startup, the state recorded for each
  milestone, and the final closeout sequence.
expect_skill: true
criteria:
  - "Executor creates a tracked plan-only first commit before implementation"
  - "Executor pushes the named branch and opens one draft PR referencing the plan and issue"
  - "The draft PR body contains an immutable GitHub blob deeplink to the plan"
  - "Executor posts an initial bootstrap comment and a comment for every green milestone"
  - "Each milestone comment includes commits, validation output, and a next resume point"
  - "Posts every complete reviewer verdict to the same PR before triage or follow-up"
  - "Copies every CHANGES REQUIRED finding verbatim and posts finding-by-finding resolution comments"
  - "The PR remains draft through review"
  - "Planner removes the plan, marks the PR ready, and merges only after final reviewer approval"
  - "A failed bootstrap action stops the executor before implementation"
allowed_tools: []
timeout: 180
