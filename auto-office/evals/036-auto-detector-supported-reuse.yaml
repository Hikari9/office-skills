name: auto-detector reuses a supported orchestrator without prompting
prompt: |
  /auto-office planner_mode=auto Use this deterministic fixture: the invoking orchestrator is exactly
  claude/opus-5@medium, a declared v2 planner triple, and a plan is needed. State whether the
  orchestrator asks the user, whether a duplicate planner call runs, and the handoff metadata.
expect_skill: true
criteria:
  - "Detects the exact supported orchestrator planner triple"
  - "Does not show the unsupported-orchestrator planner-choice prompt"
  - "Reuses the orchestrator planning step without a duplicate call when isolation is not required"
  - "Records detector_verdict=supported and reused_from_orchestrator=true"
  - "Leaves executor and reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
