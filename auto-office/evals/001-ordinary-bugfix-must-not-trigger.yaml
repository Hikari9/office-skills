name: Ordinary bugfix does not summon an office
# Every office hub says "Use ONLY when explicitly invoked ... Never self-triggered."
# That is a false-positive test, and it is the single cheapest thing to regress:
# a description edit that widens the trigger costs a full orchestrated run.
prompt: "There's an off-by-one in src/pagination.ts — the last page shows one row too many. Fix it."
expect_skill: false
criteria:
  - "Does not invoke or announce any *-office skill"
  - "Addresses the bug directly rather than proposing a planner/executor/reviewer workflow"
allowed_tools: ["Read", "Grep", "Glob"]
