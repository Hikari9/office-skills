name: Executor ladder falls through to gpt-5.6-sol low as the last pick
prompt: |
  /auto-office full The approved plan has 5 tasks. Deterministic availability fixture: agy is not
  authenticated, the claude CLI is not installed, and codex is installed, authenticated, and
  launchable. State the executor brand, model, effort, and what must be recorded about this choice.
expect_skill: true
criteria:
  - "Selects codex gpt-5.6-sol at low effort as the executor"
  - "Passes the effort as -c model_reasoning_effort=\"low\" rather than relying on the codex config default"
  - "Does not select gpt-5.6-luna as the executor"
  - "Flags that Sol low is unvalidated as an executor in this office and must be recorded in routing-outcomes.md"
  - "Records why rungs 1 and 2 were unavailable"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
