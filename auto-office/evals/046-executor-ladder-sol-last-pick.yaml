name: Executor ladder falls through to Codex Luna xhigh as the last pick
prompt: |
  /auto-office full The approved plan has 5 tasks. Deterministic availability fixture: Gemini cannot
  launch after a quota failure, claude has repeated agent failures, and codex is installed,
  authenticated, and launchable. State the executor brand, model, effort, and what must be recorded
  about this choice.
expect_skill: true
criteria:
  - "Selects codex gpt-5.6-luna at xhigh effort as the executor"
  - "Passes the effort as -c model_reasoning_effort=\"xhigh\" rather than relying on the codex config default"
  - "Records the Gemini quota failure and repeated Sonnet failures as the reasons for fallback"
  - "Does not select gpt-5.6-sol as the executor"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
