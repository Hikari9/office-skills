name: Phase 1 scouts default to Codex Luna medium when usage is measurable
prompt: |
  /auto-office Phase 1 scout routing. The availability probe reports that agy is installed,
  authenticated, and launchable, while Codex is also available with measurable headroom. State the
  exact model and effort for the read-only scouts, the required prompt safety line, and the fallback
  policy if Codex becomes unavailable before a later wave.
expect_skill: true
criteria:
  - "Selects Codex gpt-5.6-luna at medium effort"
  - "Treats Codex Luna medium as the nominal scout default when usage is measurable"
  - "Includes the exact Phase 1 PLAN ONLY and no-write safety instruction"
  - "States Gemini gemini-3.7-flash-low as the usage-unknown or thin-Codex fallback, then Claude haiku low"
  - "Uses the same Herdr/same-brand-in-session/cross-brand-CLI dispatch contract as executors"
  - "Forbids inheriting planner settings or escalating a scout above medium"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
