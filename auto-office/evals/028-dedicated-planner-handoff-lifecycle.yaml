name: v2 dedicated plan drafter returns a serialized handoff
prompt: |
  /auto-office planner_mode=dedicated The invoking Claude session holds the Planner role
  (orchestrator). Use a separate plan-drafter call to produce the implementation plan, then continue
  the v2 lifecycle. Explain the request sent to the plan drafter, the serialized artifact it returns,
  the read-back validation, and which role owns dispatch and state after the handoff.
expect_skill: true
criteria:
  - "Distinguishes the user's invoking model (the Planner/orchestrator) from the dedicated plan drafter, an added role"
  - "Performs a separate plan-drafter call rather than relying on hidden state"
  - "Returns a serialized handoff containing the drafter metadata, base identity, and complete plan-contract sections"
  - "Has the Planner validate the handoff before plan review, approval, executor dispatch, and closeout — never adopting it unread"
  - "States that the dedicated plan drafter cannot ask the user, dispatch the executor, or own any lifecycle state or gate"
  - "Continues the existing v2 lifecycle after the handoff"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 260
