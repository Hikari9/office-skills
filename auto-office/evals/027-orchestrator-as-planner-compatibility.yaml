name: v2 keeps orchestrator-as-drafter compatibility
prompt: |
  /auto-office planner_mode=inline Implement the requested change using the existing v2
  lifecycle. Explain which model holds the Planner role, which call drafts the plan, whether a
  dedicated plan drafter is invoked, and how the normal plan approval, executor, reviewer, and closeout
  stages continue.
expect_skill: true
criteria:
  - "Identifies the invoking model as the Planner (orchestrator), never a second role"
  - "Uses the existing orchestrator-as-drafter planning step without a redundant dedicated call"
  - "Preserves the tracked plan, approval, executor, independent reviewer, and closeout lifecycle"
  - "States that this explicit mode is backward-compatible v2 behavior"
  - "Does not auto-route the orchestrator or change executor/reviewer routing"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
