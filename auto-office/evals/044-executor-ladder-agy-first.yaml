name: Executor ladder defaults to Gemini Flash medium when usage is usable
prompt: |
  /auto-office full The approved plan has 3 tasks in one repo. Deterministic availability fixture:
  agy, claude, and codex are all installed, authenticated, launchable, and have usable measured
  headroom, and no caller override names a brand. State the executor brand, model, effort, and why
  the other rungs were not taken.
expect_skill: true
criteria:
  - "Selects agy as the executor at gemini-3.8-flash-medium"
  - "Records medium effort and does not mechanically disqualify Gemini based on frontend/fullstack/backend task shape"
  - "Names claude sonnet high as rung 2 and gpt-5.6-luna xhigh as rung 3 without taking them"
  - "States that usage and launchability weigh more than public benchmark/task-fit scores"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
