name: auto-detector does not prompt when no plan is needed
prompt: |
  /auto-office planner_mode=auto Use this deterministic fixture: the fit test selected direct gear,
  so no implementation plan is needed. The invoking orchestrator is an unsupported
  claude/sonnet-5@high triple. State what the detector does and does not do.
expect_skill: true
criteria:
  - "Records that no plan is needed"
  - "Does not ask the planner-choice question"
  - "Does not invoke a dedicated planner or orchestrator planning step"
  - "Records detector_verdict=not-needed rather than treating the unsupported triple as supported"
  - "Keeps the direct gear decision intact"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
