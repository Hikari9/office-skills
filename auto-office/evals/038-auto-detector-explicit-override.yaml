name: explicit plan-drafter override suppresses auto-detector prompt
prompt: |
  /auto-office planner_mode=dedicated planner=codex/gpt-6-astra@medium Use this deterministic
  fixture: the invoking orchestrator is claude/sonnet-5@high and a plan is needed. State why the
  auto-detector prompt is not shown and which exact drafter triple is selected.
expect_skill: true
criteria:
  - "Treats the explicit planner_mode and planner triple as caller overrides"
  - "Does not show the unsupported-orchestrator prompt"
  - "Selects exactly codex/gpt-6-astra@medium"
  - "Records the override and plan-drafter metadata without auto-routing the orchestrator"
  - "Leaves executor and reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
