name: Executor ladder drops to Sonnet high when the plan exceeds three tasks
prompt: |
  /auto-office full The approved plan has 6 tasks in one repo. Deterministic availability fixture:
  agy, claude, and codex are all installed, authenticated, and launchable, and no caller override
  names a brand. State the executor brand, model, and effort, and justify it against the ladder.
expect_skill: true
criteria:
  - "Selects claude sonnet at high effort as the executor"
  - "States that agy's 3-task cap disqualifies rung 1 for a 6-task plan"
  - "Rejects splitting the plan into multiple agy runs as a way to stay under the cap"
  - "Does not escalate the executor above high effort or to opus"
  - "Treats the cap as observed behavior in this workspace, not an estimate"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
