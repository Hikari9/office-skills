name: Planner decides whether a new review round is warranted
# review-states.md: CHANGES REQUIRED is a planner disposition checkpoint, not an automatic fix wave.
prompt: |
  /auto-office The reviewer returned `CHANGES REQUIRED` on round 2 with one important finding.
  The finding affects executable behavior, but the proposed fix would expand the task's scope.
  Explain the planner's next decision, including the reflection before the fix and the checkpoint
  during the fix if the implementation changes shape.
expect_skill: true
criteria:
  - "Treats CHANGES REQUIRED as a planner disposition checkpoint rather than an automatic next round"
  - "Records a finding-by-finding status, recommendation, concrete failure scenario, and expected outcome"
  - "Reflects before the fix and re-evaluates during the fix if scope, assumptions, or risk change"
  - "Chooses FIX_AND_REVIEW when an accepted fix changes executable behavior or another gated surface"
  - "States that only APPROVED leaves review and the planner cannot self-approve"
  - "Does not automatically infer PLAN DEFECT merely because two rounds produced CHANGES REQUIRED"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 240
