name: auto-detector resolves deterministically when isolation is required and the orchestrator is unsupported
prompt: |
  /auto-office planner_mode=auto planner_isolation=required Use this deterministic fixture: the
  invoking orchestrator is claude/sonnet-5@high, which is not one of the declared v2 plan-drafter
  triples, and a plan is needed. Explain whether the unsupported-orchestrator prompt runs and which
  drafter is actually selected.
expect_skill: true
criteria:
  - "Detects that the orchestrator triple is unsupported"
  - "Does not show the AskUserQuestion prompt, because planner_isolation=required is an explicit caller decision"
  - "Resolves to the declared dedicated default claude/opus-5@medium rather than reaching a state with no drafter selected"
  - "Records prompt_shown=false, prompt_choice=null, and detector_verdict=unsupported"
  - "Leaves executor and reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
