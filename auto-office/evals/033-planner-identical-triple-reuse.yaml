name: v2 reuses an identical planner triple deterministically
prompt: |
  /auto-office planner_mode=dedicated The orchestrator and requested planner are the exact same
  triple: claude/opus-5@medium. No explicit planner isolation was requested. Explain whether a
  second call is made and what metadata proves the decision.
expect_skill: true
criteria:
  - "Recognizes the exact harness/model/effort match"
  - "Reuses the orchestrator planning step instead of making an unnecessary duplicate call"
  - "Records reused_from_orchestrator=true"
  - "Keeps planner_mode and the selected triple observable"
  - "States that planner_isolation=required would force a separate call"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
