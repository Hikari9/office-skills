name: auto-detector forces a separate call when isolation is required, even for a supported triple
prompt: |
  /auto-office planner_mode=auto planner_isolation=required Use this deterministic fixture: the
  invoking orchestrator is exactly claude/opus-5@medium, a declared v2 plan-drafter triple, and a
  plan is needed. Explain whether the orchestrator's own planning step is reused and what triple is
  actually launched.
expect_skill: true
criteria:
  - "Detects the exact supported orchestrator triple"
  - "Does not reuse the orchestrator's own planning step despite the exact match, because isolation is required"
  - "Makes a separate dedicated call at claude/opus-5@medium rather than skipping selection"
  - "Records reused_from_orchestrator=false and isolation_requested=true"
  - "Leaves executor and reviewer routing unchanged"
allowed_tools: ["Read", "Grep", "Glob"]
timeout: 220
